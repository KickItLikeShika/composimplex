model_name: google/gemma-4-26B-A4B-it
benchmark: LIVECODEBENCH_V6
dtype: bfloat16
chat_template: {enabled: true, enable_thinking: false}

sampler:
  temperature: 0.5
  max_new_tokens: 3072
  support: {type: topp, top_p: 0.9, temperature: 0.5}
  base_distribution: {type: softmax, temperature: 1.0}
  lambda: 1.0
  solver: auto
  optimizer: {name: mirror_ascent, steps: 10, lr: 0.1, tol: 0.0}
  chooser: {type: multinomial}
  regularizers:
    - {type: kl_to_base, alpha: 0.5}
    - {type: diversity_gap, alpha: 0.5, K: 16, gap_tau: 1.0}

run:
  seed: 0
  num_samples: 16
  output_dir: results/starter/gemma4-26b-a4b-it/livecodebench_v6/{backend}

evaluation:
  num_workers: 4
  timeout: 6
  metrics:
    - pass_at_k
    - all_pass_at_16
    - hard_pass_at_1
    - latency
    - throughput
    - completion_tokens
    - kl_q_p
    - js_q_p
    - entropy
    - topm_coverage
    - diversity_gap

transformers:
  max_model_len: 8192
  batch_size: 4

vllm:
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9
  max_model_len: 8192
  max_num_seqs: 16
  batch_size: 4
