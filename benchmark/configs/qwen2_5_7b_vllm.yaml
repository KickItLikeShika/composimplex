# VLLM_USE_V1=0 python benchmark/run.py --backend vllm --config benchmark/configs/qwen2_5_7b_vllm.yaml
model_name: Qwen/Qwen2.5-7B
benchmark: MATH
dtype: bfloat16

sampler:
  temperature: 0.5
  max_new_tokens: 3072
  support: {type: topm, value: 200}
  base_distribution: {type: softmax, temperature: 1.0}
  lambda: 1.0
  solver: mirror_ascent
  optimizer: {name: mirror_ascent, steps: 10, lr: 0.1, tol: 0.0}
  chooser: {type: multinomial}
  regularizers:
    - {type: kl_to_base, alpha: 0.5}
    - {type: coverage, alpha: 0.5, K: 16, weight_mode: topm_l2, top_m: 8}

run:
  seed: 0  # Each question uses sample seeds 0 through 15.
  num_samples: 16
  # max_examples: 2  # Uncomment for a smoke test; use a fresh output_dir each run.
  output_dir: results/vllm_example/qwen2.5-7b/math/kl_coverage/{backend}

evaluation:
  metrics:
    - pass_at_k
    - sc_at_k
    - semantic_reasoning_diversity
    - latency
    - throughput
    - completion_tokens
    - kl_q_p
    - js_q_p
    - entropy
    - topm_coverage
    - diversity_gap

vllm:
  tensor_parallel_size: 1
  skip_tokenizer_init: true  # Encode/decode externally; pass EOS stop IDs explicitly.
  gpu_memory_utilization: 0.9
  max_model_len: 4096
  max_num_seqs: 32  # vLLM's maximum concurrent sequences.
  batch_size: 8  # Questions per generate() call: 8 x 16 = 128 queued requests.
